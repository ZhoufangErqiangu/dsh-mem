# Debian packaging identity for the dsh-memory plugin.
#
# These are defaults, not assignments: an environment variable or a `make`
# command-line override (make DEB_REVISION=alex1) takes precedence, so one
# release can be rebuilt without editing this file.

# The package name is the distribution identity, not the npm package name.
# The bundle keeps its own name (@local/dsh-memory) in package.json and
# cordis.patch.yml; both are recorded in the control file as X-DSH-Plugin-*.
: "${DEB_PACKAGE:=dsh-memory}"
: "${DEB_REVISION:=1}"

# The plugin is architecture-independent JavaScript that loads inside the Host
# process, so one package serves amd64, arm64, and every other architecture.
: "${DEB_ARCH:=all}"
: "${DEB_MAINTAINER:=alex <liuhlightning@qq.com>}"

# The plugin calls Host services, so it needs a Harness that provides them.
# The lower bound is the exact version the type-only devDependencies pin.
: "${DSH_PACKAGE:=deepseek-harness}"
: "${DSH_MIN_VERSION:=0.2.2~rc.5}"

# Where the package root lands. The directory contains package.json,
# cordis.patch.yml, and lib/, which is exactly what `dsh plugin add <path>`
# and the Web Plugins page read.
: "${PLUGIN_NAME:=@local/dsh-memory}"
: "${PLUGIN_INSTALL_DIR:=/usr/lib/dsh/plugins/memory}"
: "${PLUGIN_REPO_URL:=https://github.com/ZhoufangErqiangu/dsh-mem}"

# The profile the postinst suggests; the package never edits a user profile.
: "${PROFILE:=web}"

# Node.js floor for building and testing. Node strips the TypeScript tests
# directly; the package itself has no runtime of its own: it runs in the Host's
# Node process, which the Harness requires to be 24.9.0 or newer.
: "${NODE_MIN:=24.9.0}"

export DEB_PACKAGE DEB_REVISION DEB_ARCH DEB_MAINTAINER
export DSH_PACKAGE DSH_MIN_VERSION PLUGIN_NAME PLUGIN_INSTALL_DIR PLUGIN_REPO_URL
export PROFILE NODE_MIN
